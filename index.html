<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerPulse - Job Portal & Resume Builder</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- html2pdf.js CDN for client-side PDF download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    h1, h2, h3, .heading-font {
      font-family: 'Outfit', 'Inter', sans-serif;
    }

    /* Print styles for Resume */
    @media print {
      body * {
        visibility: hidden;
      }
      #resume, #resume * {
        visibility: visible;
      }
      #resume {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        margin: 0 !important;
        padding: 30px !important;
        box-shadow: none !important;
      }
      .no-print {
        display: none !important;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #6366f1;
      border-radius: 4px;
    }
  </style>
</head>

    };

    // Sample Jobs Database
    const initialJobs = [

      {

        skills: ["React Native", "JavaScript", "Redux", "Android/iOS"],
        description: "Build cross-platform mobile apps for iOS and Android using React Native, delivering fast 60fps animations and smooth offline access.",

    // ==========================================
    // EXACT REQUESTED RESUME COMPONENT (React.forwardRef)
    // ==========================================
    const Resume = React.forwardRef((props, ref) => {
      const user = props.userData || props.user || initialUserData;
      const themeKey = props.resumeTheme || "blue";
      const theme = resumeColorStyles[themeKey] || resumeColorStyles.blue;

      return (
        <div 
          ref={ref} 
          id="resume" 
          style={{ 
            padding: "36px", 
            background: "#ffffff", 
            color: "#1e293b", 
            fontFamily: "'Inter', sans-serif",
            borderRadius: "12px",
            boxShadow: "0 20px 30px -10px rgba(0, 0, 0, 0.15)",
            borderTop: `6px solid ${theme.border}`
          }}
        >
          <h2 style={{ fontSize: "30px", fontWeight: "800", color: theme.title, marginBottom: "4px", letterSpacing: "-0.5px" }}>{user.name}</h2>
          <hr style={{ margin: "14px 0", border: "none", borderTop: `3px solid ${theme.border}` }} />
          
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "16px" }}>
            <p style={{ margin: "4px 0", fontSize: "14px", color: "#334155" }}><strong>Email:</strong> {user.email}</p>
            <p style={{ margin: "4px 0", fontSize: "14px", color: "#334155" }}><strong>Phone:</strong> {user.phone}</p>
            <p style={{ margin: "4px 0", fontSize: "14px", color: "#334155", gridColumn: "span 2" }}><strong>Address:</strong> {user.address}</p>
          </div>

          <h4 style={{ marginTop: "22px", marginBottom: "6px", fontSize: "16px", fontWeight: "700", color: theme.primary, borderBottom: `1px solid ${theme.border}40`, paddingBottom: "4px" }}>Education</h4>
          <p style={{ margin: "4px 0", fontSize: "14px", color: "#334155", lineHeight: "1.6" }}>{user.education}</p>

          <h4 style={{ marginTop: "22px", marginBottom: "6px", fontSize: "16px", fontWeight: "700", color: theme.primary, borderBottom: `1px solid ${theme.border}40`, paddingBottom: "4px" }}>Skills</h4>
          <p style={{ margin: "4px 0", fontSize: "14px", color: "#334155", lineHeight: "1.6" }}>{user.skills}</p>

          <h4 style={{ marginTop: "22px", marginBottom: "6px", fontSize: "16px", fontWeight: "700", color: theme.primary, borderBottom: `1px solid ${theme.border}40`, paddingBottom: "4px" }}>Projects</h4>
          <p style={{ margin: "4px 0", fontSize: "14px", color: "#334155", lineHeight: "1.6", whiteSpace: "pre-line" }}>{user.projects}</p>

          <h4 style={{ marginTop: "22px", marginBottom: "6px", fontSize: "16px", fontWeight: "700", color: theme.primary, borderBottom: `1px solid ${theme.border}40`, paddingBottom: "4px" }}>Experience</h4>
          <p style={{ margin: "4px 0", fontSize: "14px", color: "#334155", lineHeight: "1.6", whiteSpace: "pre-line" }}>{user.experience}</p>
        </div>
      );
    });

    // Main App Component
    function App() {
      const [activeTab, setActiveTab] = useState('jobs'); 
      const [currentAppTheme, setCurrentAppTheme] = useState('midnight'); // 'midnight' | 'emerald' | 'crimson' | 'sapphire'
      const [currentResumeTheme, setCurrentResumeTheme] = useState('blue'); // 'blue' | 'emerald' | 'purple' | 'crimson' | 'charcoal'

      const activeTheme = appThemes[currentAppTheme] || appThemes.midnight;

      // LocalStorage persistence for user resume data
      const [userData, setUserData] = useState(() => {
        const saved = localStorage.getItem('careerpulse_userData');
        return saved ? JSON.parse(saved) : initialUserData;
      });

      // LocalStorage persistence for job postings
      const [jobsList, setJobsList] = useState(() => {
        const saved = localStorage.getItem('careerpulse_jobs');
        return saved ? JSON.parse(saved) : initialJobs;
      });

      // LocalStorage persistence for applied jobs
      const [appliedJobs, setAppliedJobs] = useState(() => {
        const saved = localStorage.getItem('careerpulse_applied');
        return saved ? JSON.parse(saved) : [];
      });

      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedType, setSelectedType] = useState('All');
      const [applyingJob, setApplyingJob] = useState(null); 
      const [showPostJobModal, setShowPostJobModal] = useState(false);
      const [showThemePicker, setShowThemePicker] = useState(false);
      const [toast, setToast] = useState(null);

      const [newJobForm, setNewJobForm] = useState({
        title: "", company: "", location: "", type: "Full-Time", category: "Frontend", salary: "", skills: "", description: "", requirements: ""
      });

      const resumeRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('careerpulse_userData', JSON.stringify(userData));
      }, [userData]);

      useEffect(() => {
        localStorage.setItem('careerpulse_applied', JSON.stringify(appliedJobs));
      }, [appliedJobs]);

      useEffect(() => {
        localStorage.setItem('careerpulse_jobs', JSON.stringify(jobsList));
      }, [jobsList]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, applyingJob, showPostJobModal, showThemePicker]);

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 4000);
      };

      const handleDownloadPDF = () => {
        const element = resumeRef.current || document.getElementById('resume');
        if (!element) {
          showToast("Error: Resume component reference not found!");
          return;
        }

        const opt = {
          margin:       [10, 10, 10, 10],
          filename:     `${userData.name.replace(/\s+/g, '_')}_Resume.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, useCORS: true, logging: false },
          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        if (window.html2pdf) {
          window.html2pdf().set(opt).from(element).save();
          showToast(`📄 Downloading ${userData.name}'s Resume PDF...`);
        } else {
          window.print();
        }
      };

      const handleConfirmApply = () => {
        if (!applyingJob) return;
        
        const applicationRecord = {
          ...applyingJob,
          appliedDate: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
          status: 'Under Review'
        };

        setAppliedJobs([applicationRecord, ...appliedJobs]);
        handleDownloadPDF();
        showToast(`🎉 Application submitted for ${applyingJob.title} at ${applyingJob.company}!`);
        setApplyingJob(null);
      };

      const handleCreateJob = (e) => {
        e.preventDefault();
        if (!newJobForm.title || !newJobForm.company || !newJobForm.salary) {
          showToast("Please fill in Job Title, Company Name, and Salary.");
          return;
        }

        const createdJob = {
          id: Date.now(),
          title: newJobForm.title,
          company: newJobForm.company,
          logo: "💼",
          location: newJobForm.location || "Remote",
          type: newJobForm.type,
          category: newJobForm.category,
          salary: newJobForm.salary,
          posted: "Just now",
          skills: newJobForm.skills ? newJobForm.skills.split(',').map(s => s.trim()) : ["JavaScript", "React"],
          description: newJobForm.description || "Exciting opportunity to join our engineering team.",
          requirements: newJobForm.requirements ? newJobForm.requirements.split('\n').filter(Boolean) : ["Relevant industry experience."]
        };

        setJobsList([createdJob, ...jobsList]);
        setShowPostJobModal(false);
        showToast(`💼 Job "${createdJob.title}" posted successfully!`);
        setNewJobForm({
          title: "", company: "", location: "", type: "Full-Time", category: "Frontend", salary: "", skills: "", description: "", requirements: ""
        });
      };

      const filteredJobs = jobsList.filter(job => {
        const matchesSearch = job.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              job.company.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              job.skills.some(s => s.toLowerCase().includes(searchTerm.toLowerCase()));
        const matchesCategory = selectedCategory === 'All' || job.category === selectedCategory;
        const matchesType = selectedType === 'All' || job.type === selectedType;
        return matchesSearch && matchesCategory && matchesType;
      });

      return (
        <div className={`h-full flex flex-col ${activeTheme.bg} text-slate-100 overflow-hidden transition-all duration-300`}>
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce">
              <span className="text-lg">✨</span>
              <span className="font-medium text-sm">{toast}</span>
            </div>
          )}

          {/* Header Navigation Bar */}
          <header className={`${activeTheme.headerBg} backdrop-blur-md border-b ${activeTheme.border} px-6 py-3.5 flex items-center justify-between z-10 shadow-lg`}>
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('jobs')}>
              <div className={`w-10 h-10 rounded-xl bg-gradient-to-tr ${activeTheme.gradient} flex items-center justify-center text-white text-xl font-bold shadow-lg`}>
                💼
              </div>
              <div>
                <h1 className="font-extrabold text-lg text-white tracking-tight flex items-center gap-2">
                  CareerPulse <span className="bg-indigo-500/10 text-indigo-400 text-xs px-2 py-0.5 rounded-full border border-indigo-500/20 font-semibold">Pro</span>
                </h1>
                <p className="text-xs text-slate-400">Job Portal & PDF Resume Hub</p>
              </div>
            </div>

            {/* Nav Tabs */}
            <nav className="flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-xl border border-slate-800/80">
              <button 
                onClick={() => setActiveTab('jobs')} 
                className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 ${
                  activeTab === 'jobs' 
                    ? activeTheme.btnPrimary 
                    : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                }`}
              >
                🔍 Explore Jobs
              </button>
              <button 
                onClick={() => setActiveTab('applications')} 
                className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 relative ${
                  activeTab === 'applications' 
                    ? activeTheme.btnPrimary 
                    : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                }`}
              >
                📋 My Applications
                {appliedJobs.length > 0 && (
                  <span className="bg-white text-slate-950 text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-extrabold">
                    {appliedJobs.length}
                  </span>
                )}
              </button>
              <button 
                onClick={() => setActiveTab('resume')} 
                className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 ${
                  activeTab === 'resume' 
                    ? activeTheme.btnPrimary 
                    : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                }`}
              >
                📄 Resume Builder & PDF
              </button>
            </nav>

            {/* Right Header Controls & Color Palette Selector */}
            <div className="flex items-center gap-3">
              
              {/* Theme Palette Switcher Dropdown */}
              <div className="relative">
                <button
                  onClick={() => setShowThemePicker(!showThemePicker)}
                  className="bg-slate-800/90 hover:bg-slate-700/90 text-slate-200 border border-slate-700 px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5"
                >
                  <span>{activeTheme.badge}</span> Theme ({activeTheme.name}) 🎨
                </button>

                {showThemePicker && (
                  <div className="absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-2xl z-50 space-y-2">
                    <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Portal UI Color Palette</p>
                    {Object.values(appThemes).map(t => (
                      <button
                        key={t.id}
                        onClick={() => {
                          setCurrentAppTheme(t.id);
                          setShowThemePicker(false);
                          showToast(`🎨 Switched UI Theme to ${t.name}`);
                        }}
                        className={`w-full text-left px-3 py-2 rounded-lg text-xs font-medium flex items-center justify-between transition ${
                          currentAppTheme === t.id ? 'bg-slate-800 text-white font-bold' : 'text-slate-300 hover:bg-slate-800/50'
                        }`}
                      >
                        <span className="flex items-center gap-2">{t.badge} {t.name}</span>
                        {currentAppTheme === t.id && <span className="text-xs">✓</span>}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <button 
                onClick={() => setShowPostJobModal(true)}
                className="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-md shadow-emerald-600/20"
              >
                ➕ Post Job
              </button>

              <button 
                onClick={handleDownloadPDF}
                className="bg-slate-800/90 hover:bg-slate-700 text-blue-400 border border-slate-700 px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-sm"
              >
                ⬇️ PDF Resume
              </button>
            </div>
          </header>

          {/* TAB 1: JOB EXPLORER BOARD */}
          {activeTab === 'jobs' && (
            <div className="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
              
              {/* Hero Banner */}
              <div className={`relative rounded-3xl bg-gradient-to-r ${activeTheme.gradient} p-8 overflow-hidden shadow-2xl`}>
                <div className="absolute right-0 top-0 w-96 h-96 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>
                <div className="relative z-10 max-w-2xl">
                  <span className="inline-block bg-white/15 backdrop-blur-md text-white text-xs font-bold px-3 py-1 rounded-full mb-3 border border-white/20">

                      type="button"
                      onClick={() => setShowPostJobModal(false)}
                      className="px-4 py-2 rounded-xl text-slate-400 hover:bg-slate-800"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-xl shadow-lg"
                    >
                      Publish Job Opening 🚀
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
